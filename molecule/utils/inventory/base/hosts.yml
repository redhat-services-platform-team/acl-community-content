---
# Base inventory layer, loaded by every scenario (see
# .config/molecule/config.yml). Carries no test instances — those come from
# the sibling linux/ and windows/ inventories a scenario stacks on top.
#
# localhost is listed explicitly so it joins `all` and picks up the
# molecule_aws_* vars from group_vars/all.yml (implicit localhost would not).
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
