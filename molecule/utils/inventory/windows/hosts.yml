---
# Windows test instances. Scenarios include this layer by listing
# --inventory=../utils/inventory/windows/ in their molecule.yml executor args (the
# base config includes it by default).
all:
  children:
    molecule:
      hosts:
        win2022:
          molecule_aws_connection: winrm
          # Official Amazon-published Windows Server AMIs (monthly patched
          # builds). Swap the name for Windows_Server-2025-* for 2025.
          molecule_aws_ami_owner: "801119661308"
          molecule_aws_ami_name: Windows_Server-2022-English-Full-Base-*
