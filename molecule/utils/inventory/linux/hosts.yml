---
# Linux test instances. Scenarios include this layer by listing
# --inventory=../utils/inventory/linux/ in their molecule.yml executor args (the
# base config includes it by default).
#
# Each host defines its own image identity:
#   molecule_aws_ami_name — AWS AMI lookup filter (newest match wins)
# Optional per-host: molecule_aws_ami_owner (defaults to Red Hat, see
# base/group_vars/all.yml), molecule_aws_image_id (pin an AMI, skips the
# lookup), molecule_aws_connection (ssh/winrm), molecule_aws_instance_type.
all:
  children:
    molecule:
      hosts:
        rhel10:
          molecule_aws_ami_name: RHEL-10*HVM*x86_64*
        rhel9:
          molecule_aws_ami_name: RHEL-9*HVM*x86_64*
