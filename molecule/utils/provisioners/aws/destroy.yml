---
# Tear down everything create.yml made, keyed off the molecule_scenario tag
# and the molecule-<scenario> name prefix — including the managed VPC, subnet,
# internet gateway, and route table when no existing network IDs were given.
- name: Destroy AWS instances
  hosts: localhost
  gather_facts: false
  vars:
    _prefix: "molecule-{{ lookup('env', 'MOLECULE_SCENARIO_NAME') | default('default', true) }}"
  tasks:
    - name: Terminate instances
      amazon.aws.ec2_instance:
        state: absent
        region: "{{ molecule_aws_region }}"
        filters:
          tag:molecule_scenario: "{{ _prefix }}"
          instance-state-name:
            - pending
            - running
            - stopping
            - stopped
        wait: true

    - name: Look up managed VPC
      amazon.aws.ec2_vpc_net_info:
        region: "{{ molecule_aws_region }}"
        filters:
          tag:Name: "{{ _prefix }}"
      register: _vpcs
      when: not (molecule_aws_vpc_id | default('', true))

    # ENI detach can lag instance termination briefly, so retry the delete.
    - name: Delete security group
      amazon.aws.ec2_security_group:
        name: "{{ _prefix }}"
        state: absent
        region: "{{ molecule_aws_region }}"
        vpc_id: >-
          {{ _vpcs.vpcs[0].vpc_id
             if (_vpcs.vpcs | default([]) | length > 0)
             else (molecule_aws_vpc_id | default(omit, true)) }}
      register: _sg
      retries: 6
      delay: 10
      until: _sg is not failed

    - name: Tear down managed network
      when:
        - not (molecule_aws_vpc_id | default('', true))
        - _vpcs.vpcs | length > 0
      vars:
        _vpc_id: "{{ _vpcs.vpcs[0].vpc_id }}"
      block:
        - name: Delete route table
          amazon.aws.ec2_vpc_route_table:
            state: absent
            region: "{{ molecule_aws_region }}"
            vpc_id: "{{ _vpc_id }}"
            lookup: tag
            resource_tags:
              Name: "{{ _prefix }}"

        - name: Detach and delete internet gateway
          amazon.aws.ec2_vpc_igw:
            state: absent
            vpc_id: "{{ _vpc_id }}"
            region: "{{ molecule_aws_region }}"

        - name: Delete subnet
          amazon.aws.ec2_vpc_subnet:
            state: absent
            vpc_id: "{{ _vpc_id }}"
            cidr: "{{ molecule_aws_vpc_cidr }}"
            region: "{{ molecule_aws_region }}"

        - name: Delete VPC
          amazon.aws.ec2_vpc_net:
            state: absent
            vpc_id: "{{ _vpc_id }}"
            region: "{{ molecule_aws_region }}"

    - name: Delete EC2 key pair
      amazon.aws.ec2_key:
        name: "{{ _prefix }}"
        state: absent
        region: "{{ molecule_aws_region }}"
